name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:geometry
      - run: npm run test:logic
      - run: npm run build
      - name: Initialize local D1
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file drizzle/0000_flimsy_sunspot.sql
      - name: Start local server
        run: npm start > /tmp/tandem-trails-server.log 2>&1 &
      - name: Wait for local server
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8787/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tandem-trails-server.log
          exit 1
      - run: npm run test:smoke
      - run: npm run test:campaign
